name: "Close Stale PRs and Issues"

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11.0.0
        with:
          # ----- Pull Request Settings -----
          days-before-pr-stale: 60
          days-before-pr-close: 7
          stale-pr-message: 'This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions!'
          close-pr-message: 'This PR has been automatically closed due to inactivity.'
          stale-pr-label: 'stale'
          
          # ----- Optional: Issue Settings -----
          # Set to -1 if you want to skip issues and only handle PRs
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-message: 'This issue has been automatically marked as stale due to inactivity.'
          close-issue-message: 'This issue has been automatically closed due to inactivity.'
          stale-issue-label: 'stale'

          # ----- Exemptions -----
          # Prevent PRs with these labels from ever being closed
          exempt-pr-labels: 'pinned,security,keep' 
