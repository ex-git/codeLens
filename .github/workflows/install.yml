name: install

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  package-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use npm with explicit install-script approvals
        run: |
          npm install --global npm@11.19.1
          npm --version
      - name: Install checkout dependencies with scoped script permissions
        run: |
          # npm ci requires project-scoped approvals, not --allow-scripts.
          # Restore the manifest even on failure; never ship these CI-only approvals.
          cp package.json "$RUNNER_TEMP/codelens-package.json"
          trap 'cp "$RUNNER_TEMP/codelens-package.json" package.json' EXIT
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packages = Object.keys(pkg.dependencies)
            .filter(name => name === "better-sqlite3" || name === "tree-sitter" || name.startsWith("tree-sitter-"))
            .concat("esbuild");
          pkg.allowScripts = Object.fromEntries(packages.map(name => [name, true]));
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm ci --legacy-peer-deps
      - run: npm run build
      - name: Check platform installer failure paths
        run: npm test -- tests/installers.test.ts tests/upgrade.test.ts
      - name: Verify clean tarball installs, blocked scripts, and scoped recovery
        run: npm run test:install
