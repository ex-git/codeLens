name: install

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  package-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use npm with explicit install-script approvals
        run: |
          npm install --global npm@11.19.1
          npm --version
      - name: Install checkout dependencies with scoped script permissions
        run: |
          native="$(node -e 'const p = require("./package.json"); console.log(Object.keys(p.dependencies).filter(n => n === "better-sqlite3" || n === "tree-sitter" || n.startsWith("tree-sitter-")).concat("esbuild").join(","))')"
          npm ci --legacy-peer-deps --allow-scripts="$native"
      - run: npm run build
      - name: Check platform installer failure paths
        run: npm test -- tests/installers.test.ts tests/upgrade.test.ts
      - name: Verify clean tarball installs, blocked scripts, and scoped recovery
        run: npm run test:install
